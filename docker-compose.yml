services:
  asteroide-api:
    image: php:8.0-fpm
    container_name: asteroide-api
    volumes:
      - ./app:/var/www/html
    network_mode: host

  asteroide-proxy:
    image: nginx:latest
    container_name: asteroide-proxy
    # ports:
    #   - "8080:80"
    network_mode: host
    volumes:
      - ./app:/var/www/html
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./.nginx/snippets:/etc/nginx/snippets
    depends_on:
      - asteroide-api

  asteroide-db:
    image: mariadb:latest
    container_name: asteroide-db
    # command: "sleep 5 && mariadb-import -f db_asteroide /etc/db_asteroide.sql"
    volumes:
      - ./app/DB/db_asteroide.sql:/etc/db_asteroide.sql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
